version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:40"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 3
    # A new release ages a week before Dependabot proposes it (security updates are not delayed).
    cooldown:
      default-days: 7
    # Minor and patch bumps share one PR; majors stay individual so they get reviewed alone.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:40"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 3
    # A new release ages a week before Dependabot proposes it (security updates are not delayed).
    cooldown:
      default-days: 7
    # Minor and patch bumps share one PR; majors stay individual so they get reviewed alone.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
